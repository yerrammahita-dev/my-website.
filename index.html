<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Ways — Read, Create, Communicate</title>
<style>
:root{--ink:#24333b;--muted:#68777c;--paper:#fbfaf7;--white:#fff;--line:#e4e8e5;--green:#376c5c;--mint:#e8f2ed;--coral:#f4e3dc;--blue:#e5eef3;--yellow:#f5efd9;--shadow:0 8px 26px #263b3210}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #e4a44b;outline-offset:3px}.shell{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--green)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:650}.nav button.active,.btn.primary{background:var(--green);color:white;border-color:var(--green)}.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}main{min-height:65vh}.hero{position:relative;overflow:hidden;border-radius:24px;background:#edf3ef;padding:clamp(28px,6vw,68px);margin-bottom:24px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.04;max-width:650px;margin:0 0 16px;letter-spacing:-2px}.hero p{font-size:19px;color:#52645d;max-width:590px}.squiggles{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}.squiggles.off{opacity:0}.squiggles svg{position:absolute;width:100%;height:100%;inset:0}.squiggles path{fill:none;stroke-width:5;opacity:.22;stroke-linecap:round;animation:drift 9s ease-in-out infinite alternate}.squiggles path:nth-child(2){animation-delay:-3s}.squiggles path:nth-child(3){animation-delay:-6s}@keyframes drift{to{transform:translate(10px,-8px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}.hero-content{position:relative;z-index:1}.hero .btn{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.home-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.home-card .icon{font-size:28px}.home-card h2{font-size:20px;margin:8px 0 2px}.home-card p,.muted{color:var(--muted);margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0}.section-head h1{margin:0;font-size:34px;letter-spacing:-1px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,select,textarea{border:1px solid #d9e0dc;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}.input{min-width:190px}.book-cover{height:145px;border-radius:13px;margin-bottom:14px;display:grid;place-items:center;text-align:center;padding:16px;color:#273b35;font-size:21px;font-weight:800;background:linear-gradient(145deg,#dcebe2,#f5eee0)}.book-card{transition:transform .2s,box-shadow .2s}.book-card:hover,.book-card:focus-within{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 30px #263b3220}.reader{max-width:760px;margin:20px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,55px);text-align:center}.reader .page-text{font-size:clamp(24px,4vw,36px);line-height:1.45;min-height:180px;display:grid;place-items:center}.reader-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.board-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.categories{display:grid;gap:8px;align-content:start}.categories button{text-align:left}.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.word{min-height:76px;background:#f3f6f3;border:1px solid var(--line);border-radius:14px;font-size:20px;font-weight:700;color:var(--ink)}.word:hover{background:var(--mint)}.sentence{min-height:70px;font-size:24px;padding:14px;background:#f7f8f5;border:1px dashed #cbd6cf;border-radius:14px;margin:12px 0}.canvas-wrap{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}.canvas-wrap canvas{display:block;width:100%;height:min(55vh,520px);touch-action:none;cursor:crosshair}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.colors{display:flex;gap:6px;flex-wrap:wrap}.color{width:28px;height:28px;border:2px solid white;box-shadow:0 0 0 1px #aab5af;border-radius:50%;padding:0}.color.selected{box-shadow:0 0 0 3px var(--green)}.coloring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.color-page{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.color-page svg{width:100%;height:180px;background:#faf9f5;border-radius:12px}.color-page svg [data-color]{cursor:pointer;stroke:#53615c;stroke-width:2}.color-page svg [data-color]:hover{stroke:#111;stroke-width:4}.notice{background:#f5efd9;border-radius:12px;padding:12px 14px;color:#665a32}.list{display:grid;gap:9px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.small{font-size:14px}.footer{padding:24px 0;color:var(--muted);font-size:14px}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:700px){.shell{padding:13px}.top{align-items:flex-start;flex-direction:column}.nav{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.nav button{padding:9px 5px;font-size:14px}.board-layout{grid-template-columns:1fr}.categories{display:flex;overflow:auto}.categories button{white-space:nowrap}.hero{padding:30px 22px}.section-head h1{font-size:29px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">little <span>ways</span></div>
  <nav class="nav" aria-label="Main navigation" id="nav"></nav>
</header>
<main id="app"></main>
<footer class="footer">A calm space to read, create, and communicate. Your saved information stays in this browser.</footer>
</div>
<script>
const STORE={vocab:"lw-vocab-v1",sentences:"lw-sentences-v1",history:"lw-history-v1",drawings:"lw-drawings-v1",colors:"lw-color-pages-v1"};
const initialVocab={
 People:["I","you","mom","dad","teacher","friend","grandma","grandpa","sister","brother","they","we"],
 Feelings:["happy","sad","tired","excited","calm","worried","silly","angry","scared","proud"],
 Actions:["want","like","need","go","stop","play","read","draw","eat","drink","help","look","make","rest"],
 Places:["home","school","park","outside","bedroom","bathroom","kitchen","library","store"],
 Objects:["book","ball","juice","toy","blanket","pencil","paper","tablet","music","snack"],
 Helpers:["please","thank you","help","yes","no","more","all done","again","my turn","your turn"],
 Needs:["break","water","food","toilet","quiet","hug","medicine","different","wait"],
 Food:["apple","banana","bread","pasta","rice","milk","water","cracker","cheese","strawberry"],
 Questions:["what","where","who","when","why","how","can I","do you"],
 Social:["hello","goodbye","excuse me","I love you","good morning","good night"],
 Sensory:["too loud","too bright","soft","cold","hot","itchy","comfortable","quiet"]
};
let vocab=load(STORE.vocab,initialVocab), saved=load(STORE.sentences,[]), history=load(STORE.history,[]), drawings=load(STORE.drawings,[]);
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function persist(){localStorage.setItem(STORE.vocab,JSON.stringify(vocab));localStorage.setItem(STORE.sentences,JSON.stringify(saved));localStorage.setItem(STORE.history,JSON.stringify(history));localStorage.setItem(STORE.drawings,JSON.stringify(drawings))}
const books=[
 {title:"The Happy Sun",author:"An original Little Ways story",summary:"A sunny day brings small surprises.",pages:["The sun woke up over the quiet town.","A little bird waved from a tree.","The sun warmed the garden and the people in it.","At evening, the sun said goodnight."]},
 {title:"My Cat and Me",author:"An original Little Ways story",summary:"A child and a curious cat explore at home.",pages:["My cat has soft paws and bright eyes.","We look for a sunny place to sit.","A paper ball rolls across the room.","At bedtime, my cat curls up beside me."]},
 {title:"The Little Garden",author:"An original Little Ways story",summary:"Seeds, water, and patience help a garden grow.",pages:["We planted tiny seeds in the soil.","The rain came softly in the morning.","Green leaves reached toward the light.","Soon, flowers opened in the garden."]},
 {title:"A Day at the Park",author:"An original Little Ways story",summary:"A friendly day outdoors with room to explore.",pages:["We walked to the park together.","I saw a duck near the pond.","We played, rested, and shared a snack.","The sky turned gold as we went home."]},
 {title:"The Red Kite",author:"An original Little Ways story",summary:"A kite finds its way into the breeze.",pages:["I carried my red kite to the hill.","The wind lifted it gently.","It danced high above the grass.","We folded it carefully and went home."]},
 {title:"A Cozy Rainy Day",author:"An original Little Ways story",summary:"A rainy day becomes a chance to make things.",pages:["Rain tapped softly on the window.","We chose a book and warm socks.","Then we drew a picture of the clouds.","The rain stopped, and the sun came out."]},
 {title:"The Helpful Turtle",author:"An original Little Ways story",summary:"A slow and thoughtful turtle helps a friend.",pages:["Turtle heard a small voice by the path.","A little beetle had lost its way.","Turtle walked with the beetle to the flowers.","They waved goodbye beneath a leaf."]},
 {title:"Milo Makes Music",author:"An original Little Ways story",summary:"Everyday sounds become a cheerful song.",pages:["Milo tapped a spoon on a bowl.","A friend shook a box of buttons.","They listened, then played together.","Their little song filled the room."]}
];
const bookColors=["linear-gradient(145deg,#dcebe2,#f5eee0)","linear-gradient(145deg,#f3ddd5,#f8f0e9)","linear-gradient(145deg,#dce8ef,#f4f0df)","linear-gradient(145deg,#e8e1f0,#f3eee4)"];
let page="Home", activeBook=null, bookPage=0, sentence=[], category=Object.keys(vocab)[0], search="";
const pages=["Home","Books","Draw","Color by Number","Sentence","Vocabulary","Caregiver","Settings"];
function go(p){page=p;render()}
function renderNav(){document.querySelector("#nav").innerHTML=pages.map(p=>`<button class="${page===p?"active":""}" data-page="${p}">${p==="Color by Number"?"Color":p==="Caregiver"?"Caregiver":p}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function render(){renderNav();const root=document.querySelector("#app");if(page==="Home")root.innerHTML=home();if(page==="Books")root.innerHTML=library();if(page==="Draw")root.innerHTML=drawing();if(page==="Color by Number")root.innerHTML=coloring();if(page==="Sentence")root.innerHTML=sentenceBoard();if(page==="Vocabulary")root.innerHTML=vocabularyPage();if(page==="Caregiver")root.innerHTML=caregiver();if(page==="Settings")root.innerHTML=settings();bind()}
function home(){return `<section class="hero"><div class="squiggles" id="squiggles"><svg viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true"><path stroke="#d47d67" d="M-20 80 C180 10 180 180 360 100 S600 10 800 100 950 120 1030 50"/><path stroke="#638e7a" d="M-20 280 C160 190 250 360 420 250 S650 170 780 290 920 330 1030 230"/><path stroke="#6c91a2" d="M100 410 C160 250 320 300 400 190 S650 100 700 210 850 260 900 130"/></svg></div><div class="hero-content"><p class="muted">A welcoming space for every way of communicating</p><h1>Read, make, and share—your way.</h1><p>Explore stories, create art, and build messages at your own pace.</p><button class="btn primary" data-go="Sentence">Make a sentence</button> <button class="btn" data-go="Books">Explore books</button><p class="small">Tap or click the <b>M</b> in “make” to hide the moving lines.</p></div></section><div class="grid">${[["📚","Read a Book","Browse original sample stories.","Books"],["✏️","Draw","Make a picture with colors and tools.","Draw"],["▧","Color by Number","Fill large, friendly picture regions.","Color by Number"],["💬","Make a Sentence","Choose words to build a message.","Sentence"],["⚙️","My Vocabulary","Personalize words and categories.","Vocabulary"],["♡","Caregiver Mode","Practice phrases and review favorites.","Caregiver"]].map(x=>`<button class="card home-card" data-go="${x[3]}" style="text-align:left;color:inherit"><span class="icon">${x[0]}</span><span><h2>${x[1]}</h2><p>${x[2]}</p></span></button>`).join("")}</div>`}
function library(){return `<div class="section-head"><div><p class="muted">Original sample stories</p><h1>Book shelf</h1></div><input class="input" id="bookSearch" placeholder="Search stories…" aria-label="Search stories"></div><div class="notice small">This prototype includes original sample stories and placeholder covers. Licensed books and official cover images are not connected.</div><div class="grid" id="bookGrid">${books.map((b,i)=>`<article class="card book-card"><div class="book-cover" style="background:${bookColors[i%4]}">${b.title}</div><h2>${b.title}</h2><p class="muted small">${b.summary}</p><button class="btn primary" data-read="${i}">Read</button></article>`).join("")}</div>`}
function reader(){let b=books[activeBook];return `<button class="btn" data-go="Books">← Back to shelf</button><article class="reader"><p class="muted">${b.title}</p><div class="page-text">${b.pages[bookPage]}</div><p class="muted">Page ${bookPage+1} of ${b.pages.length}</p><div class="reader-controls"><button class="btn" id="prevPage" ${bookPage===0?"disabled":""}>Previous</button><button class="btn" id="readAloud">Read aloud (device demo)</button><button class="btn primary" id="nextPage" ${bookPage===b.pages.length-1?"disabled":""}>Next</button></div><p class="small muted">Uses your browser’s built-in speech if available; no voice service is connected.</p></article>`}
function drawing(){return `<div class="section-head"><div><p class="muted">A simple creative space</p><h1>Drawing studio</h1></div></div><div class="toolbar"><label>Brush <select id="brush"><option>Pen</option><option>Marker</option><option>Pencil</option><option>Soft brush</option><option>Eraser</option></select></label><label>Size <input id="size" type="range" min="2" max="36" value="7"></label><label>Shape <select id="shape"><option value="free">Free draw</option><option value="line">Ruler line</option><option value="circle">Circle stencil</option><option value="square">Square stencil</option><option value="triangle">Triangle stencil</option></select></label><button class="btn" id="undo">Undo</button><button class="btn" id="clearCanvas">Clear</button><button class="btn primary" id="saveDrawing">Save drawing</button></div><div class="toolbar"><span>Color</span><div class="colors" id="palette"></div></div><div class="canvas-wrap"><canvas id="canvas" aria-label="Drawing canvas"></canvas></div><h2>Saved drawings</h2><div class="grid">${drawings.map((d,i)=>`<div class="card"><img alt="Saved drawing ${i+1}" src="${d}" style="width:100%;border-radius:10px"><button class="btn" data-delete-drawing="${i}">Remove</button></div>`).join("")||`<p class="muted">Your saved drawings will appear here.</p>`}</div>`}
function sentenceBoard(){const cats=Object.keys(vocab);if(!vocab[category])category=cats[0];return `<div class="section-head"><div><p class="muted">Choose words to share a message</p><h1>Sentence board</h1></div></div><section class="card"><div class="muted small">Your sentence — tap a word below to add it. Tap a word here to remove it.</div><div class="sentence" id="sentence">${sentence.map((w,i)=>`<button class="btn" data-remove-word="${i}">${w} ×</button>`).join(" ")||`<span class="muted">Your words will appear here.</span>`}</div><div class="row"><button class="btn" id="clearSentence">Clear sentence</button><button class="btn primary" id="speak">Speak with device voice</button><button class="btn" id="saveSentence">Save sentence</button></div></section><div class="board-layout" style="margin-top:16px"><aside class="categories">${cats.map(c=>`<button class="btn ${category===c?"primary":""}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}</aside><section class="card"><div class="word-grid">${(vocab[category]||[]).map(w=>`<button class="word" data-word="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("")||`<p class="empty">No words here yet. Add some in My Vocabulary.</p>`}</div></section></div>`}
function vocabularyPage(){return `<div class="section-head"><div><p class="muted">Caregiver tools</p><h1>My vocabulary</h1></div></div><p class="notice">Starter words are included to help you begin. Add your own words and categories; changes appear immediately on the sentence board and stay in this browser.</p><section class="card"><h2>Add a word</h2><form id="addWord" class="row"><input class="input" name="word" required placeholder="Word or short phrase"><select name="category">${Object.keys(vocab).map(c=>`<option>${escapeHtml(c)}</option>`).join("")}</select><input class="input" name="newCategory" placeholder="Or create a category"><button class="btn primary">Add word</button></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Add a category</h2><form id="addCategory" class="row"><input class="input" name="category" required placeholder="Category name"><button class="btn">Add category</button></form></section><div class="section-head"><h2>Words</h2><input id="vocabSearch" class="input" placeholder="Find a word…"></div><div id="vocabList" class="list">${vocabList()}</div>`}
function vocabList(q=""){return Object.entries(vocab).flatMap(([c,words])=>words.map((w,i)=>({c,w,i}))).filter(x=>(x.w+" "+x.c).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="list-item"><span><b>${escapeHtml(x.w)}</b> <span class="muted small">· ${escapeHtml(x.c)}</span></span><span class="row"><button class="btn small" data-edit-word="${encodeURIComponent(x.c)}|${x.i}">Edit</button><button class="btn small" data-delete-word="${encodeURIComponent(x.c)}|${x.i}">Remove</button></span></div>`).join("")||`<p class="empty">No matching words.</p>`}
function caregiver(){return `<div class="section-head"><div><p class="muted">A quieter practice space</p><h1>Caregiver mode</h1></div></div><section class="card"><h2>Practice a phrase</h2><p class="muted">Choose a phrase to load it onto the sentence board.</p><div class="row">${["I want help please","I feel happy","I need a break","I want to play","I am all done"].map(x=>`<button class="btn" data-phrase="${x}">${x}</button>`).join("")}</div><form id="customPhrase" class="row" style="margin-top:14px"><input class="input" name="phrase" required placeholder="Write a practice phrase"><button class="btn">Add phrase</button></form></section><div class="grid" style="margin-top:16px"><section class="card"><h2>Saved favorites</h2><div class="list">${saved.map((s,i)=>`<div class="list-item"><span>${escapeHtml(s)}</span><span class="row"><button class="btn small" data-load="${i}">Practice</button><button class="btn small" data-unsave="${i}">Remove</button></span></div>`).join("")||`<p class="muted">Saved sentences will show here.</p>`}</div></section><section class="card"><h2>Recent sentence history</h2><div class="list">${history.slice(0,12).map(s=>`<div class="list-item">${escapeHtml(s)}</div>`).join("")||`<p class="muted">Your recent sentences will show here.</p>`}</div></section></div><p class="small muted" style="margin-top:14px">This is a communication support prototype, not a medical or therapeutic service.</p>`}
function settings(){return `<div class="section-head"><div><p class="muted">Your browser, your choices</p><h1>Settings</h1></div></div><section class="card"><h2>Local data</h2><p>Vocabulary, drawings, saved sentences, and history are stored in this browser on this device. Clearing browser data may remove them.</p><button class="btn" id="exportData">Download my data</button> <button class="btn" id="resetData">Reset app data</button></section><section class="card" style="margin-top:14px"><h2>About this prototype</h2><p class="muted">Books and coloring pages are original sample content. Licensed book catalogs, official covers, a large 1,000-book catalog, and a fully expanded 100-by-100 vocabulary are future integrations—not included here.</p><label><input type="checkbox" id="reduceMotion"> Hide home-page motion</label></section>`}
function coloring(){let items=[["Easy","Friendly fish",["#f2a65a","#4b9b9b","#8ac27d"],["<path data-color='1' d='M38 90 Q80 35 130 90 Q80 145 38 90Z' fill='white'/><path data-color='2' d='M130 90 L170 55 L170 125Z' fill='white'/><circle data-color='3' cx='72' cy='82' r='6' fill='white'/>"]],["Easy","Sunny flower",["#f0c84b","#e78670","#6e9b6b"],["<circle data-color='1' cx='100' cy='85' r='24' fill='white'/><path data-color='2' d='M100 45 Q78 34 84 60 Q62 58 76 78 Q55 92 82 99 Q71 122 96 111 Q101 137 111 111 Q137 121 122 98 Q148 91 124 77 Q139 56 115 59 Q118 35 100 45Z' fill='white'/><path data-color='3' d='M96 108 L104 108 L108 160 L92 160Z' fill='white'/>"]],["Medium","Little sailboat",["#6fa8c3","#e7a65c","#e3d58b","#659a73"],["<path data-color='1' d='M25 125 Q100 110 175 125 L160 145 L45 145Z' fill='white'/><path data-color='2' d='M96 45 L96 118 L48 118Z' fill='white'/><path data-color='3' d='M104 58 L104 118 L150 118Z' fill='white'/><path data-color='4' d='M15 150 Q45 140 75 150 T135 150 T195 150 L195 175 L15 175Z' fill='white'/>"]],["Advanced","Cozy house",["#d77d62","#e8c77b","#6b9b73","#8fb5c4","#8a6f5a"],["<path data-color='1' d='M35 90 L100 35 L165 90Z' fill='white'/><path data-color='2' d='M48 88 L152 88 L152 155 L48 155Z' fill='white'/><rect data-color='3' x='86' y='112' width='28' height='43' fill='white'/><rect data-color='4' x='58' y='100' width='20' height='20' fill='white'/><rect data-color='5' x='122' y='100' width='20' height='20' fill='white'/>"]]];
return `<div class="section-head"><div><p class="muted">Original tap-to-color examples</p><h1>Color by number</h1></div><select id="difficulty"><option>All levels</option><option>Easy</option><option>Medium</option><option>Advanced</option></select></div><p class="notice small">These are original prototype examples, not 100 completed pages. The format can grow with more original illustrations. Tap a number below, then tap matching picture regions.</p><div class="coloring-grid">${items.map((it,i)=>`<article class="color-page" data-level="${it[0]}"><h2>${it[1]}</h2><p class="muted small">${it[0]} · Choose a color number, then tap a region.</p><svg viewBox="0 0 200 190" role="img" aria-label="${it[1]} color by number picture">${it[3].join("")}</svg><div class="row">${it[2].map((col,n)=>`<button class="btn color-number" data-pic="${i}" data-num="${n+1}" style="border-color:${col}">${n+1} <span style="display:inline-block;width:16px;height:16px;background:${col};border-radius:50%;vertical-align:middle"></span></button>`).join("")}</div><p class="small muted" id="progress${i}">Choose a number to begin.</p><button class="btn small" data-reset-pic="${i}">Reset picture</button></article>`).join("")}</div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function bind(){
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
const m=document.querySelector(".hero h1");if(m)m.onclick=()=>document.querySelector("#squiggles")?.classList.add("off");
if(page==="Books"){if(activeBook!==null){document.querySelector("#prevPage").onclick=()=>{bookPage--;render()};document.querySelector("#nextPage").onclick=()=>{bookPage++;render()};document.querySelector("#readAloud").onclick=()=>{if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(books[activeBook].pages[bookPage]))}else alert("Device speech is not available in this browser.")}}else{document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{activeBook=+b.dataset.read;bookPage=0;render()});document.querySelector("#bookSearch").oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll(".book-card").forEach((c,i)=>c.classList.toggle("hidden",!books[i].title.toLowerCase().includes(q)&&!books[i].summary.toLowerCase().includes(q)))}}}
if(page==="Draw")setupCanvas();
if(page==="Sentence"){document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{category=b.dataset.category;render()});document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{sentence.push(b.dataset.word);render()});document.querySelectorAll("[data-remove-word]").forEach(b=>b.onclick=()=>{sentence.splice(+b.dataset.removeWord,1);render()});document.querySelector("#clearSentence").onclick=()=>{sentence=[];render()};document.querySelector("#saveSentence").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");saved.unshift(s);history.unshift(s);persist();alert("Sentence saved.");render()};document.querySelector("#speak").onclick=()=>{let s=sentence.join(" ");if(!s)return alert("Choose some words first.");if("speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(s));else alert("Device speech is not available in this browser.")}}
if(page==="Vocabulary"){document.querySelector("#addWord").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=f.get("word").trim(),c=(f.get("newCategory").trim()||f.get("category"));if(f.get("newCategory").trim()&&!vocab[c])vocab[c]=[];if(!vocab[c].some(x=>x.toLowerCase()===w.toLowerCase()))vocab[c].push(w);persist();render()};document.querySelector("#addCategory").onsubmit=e=>{e.preventDefault();let c=new FormData(e.target).get("category").trim();if(vocab[c])return alert("That category already exists.");vocab[c]=[];persist();render()};document.querySelector("#vocabSearch").oninput=e=>document.querySelector("#vocabList").innerHTML=vocabList(e.target.value);document.querySelectorAll("[data-delete-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.deleteWord).split("|");if(confirm(`Remove “${vocab[c][i]}”?`)){vocab[c].splice(+i,1);persist();render()}});document.querySelectorAll("[data-edit-word]").forEach(b=>b.onclick=()=>{let[c,i]=decodeURIComponent(b.dataset.editWord).split("|"),next=prompt("Edit word:",vocab[c][i]);if(next?.trim()){vocab[c][i]=next.trim();persist();render()}})}
if(page==="Caregiver"){document.querySelectorAll("[data-phrase]").forEach(b=>b.onclick=()=>{sentence=b.dataset.phrase.split(" ");go("Sentence")});document.querySelector("#customPhrase").onsubmit=e=>{e.preventDefault();let s=new FormData(e.target).get("phrase").trim();if(s){saved.unshift(s);persist();render()}};document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{sentence=saved[+b.dataset.load].split(" ");go("Sentence")});document.querySelectorAll("[data-unsave]").forEach(b=>b.onclick=()=>{saved.splice(+b.dataset.unsave,1);persist();render()})}
if(page==="Settings"){document.querySelector("#exportData").onclick=()=>{let data={vocab,saved,history,drawings};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="little-ways-data.json";a.click();URL.revokeObjectURL(a.href)};document.querySelector("#resetData").onclick=()=>{if(confirm("Reset all saved data in this browser? This cannot be undone.")){Object.values(STORE).forEach(k=>localStorage.removeItem(k));location.reload()}}}
if(page==="Color by Number"){document.querySelector("#difficulty").onchange=e=>document.querySelectorAll(".color-page").forEach(c=>c.classList.toggle("hidden",e.target.value!=="All levels"&&c.dataset.level!==e.target.value));document.querySelectorAll(".color-number").forEach(b=>b.onclick=()=>{let card=b.closest(".color-page");card.dataset.selected=b.dataset.num;card.querySelectorAll(".color-number").forEach(x=>x.classList.toggle("primary",x===b))});document.querySelectorAll(".color-page svg [data-color]").forEach(el=>el.onclick=()=>{let card=el.closest(".color-page"),n=card.dataset.selected;if(!n)return alert("Choose a color number first.");if(el.dataset.color!==n)return;let colors=card.querySelectorAll(".color-number"),button=[...colors].find(x=>x.dataset.num===n),swatch=button.querySelector("span");el.setAttribute("fill",swatch.style.backgroundColor);let total=card.querySelectorAll("svg [data-color]").length,filled=[...card.querySelectorAll("svg [data-color]")].filter(x=>x.getAttribute("fill")!=="white").length;card.querySelector("p[id^=progress]").textContent=`${filled} of ${total} regions colored.`;let state=load(STORE.colors,{});state[card.querySelector("h2").textContent]=[...card.querySelectorAll("svg [data-color]")].map(x=>x.getAttribute("fill"));localStorage.setItem(STORE.colors,JSON.stringify(state))});document.querySelectorAll("[data-reset-pic]").forEach(b=>b.onclick=()=>{let card=b.closest(".color-page");card.querySelectorAll("svg [data-color]").forEach(x=>x.setAttribute("fill","white"));delete card.dataset.selected;card.querySelector("p[id^=progress]").textContent="Choose a number to begin."})}
}
function setupCanvas(){const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");let color="#24333b",drawing=false,start=null,undo=[];function resize(){let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;let old=document.createElement("canvas");old.width=canvas.width;old.height=canvas.height;old.getContext("2d").drawImage(canvas,0,0);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="white";ctx.fillRect(0,0,r.width,r.height);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}resize();window.addEventListener("resize",resize);let colors=["#24333b","#d85f50","#e88c58","#e7c34d","#75a66b","#438b78","#4f8ca8","#6b75a7","#9a6fa2","#d8759b","#8b5e48","#7b8584","#f1b8a8","#b9d9ca","#c8d6ed","#f1e1a0","#b5a175","#343434","#ffffff","#d7a2e8","#8dcbd1","#b1c86a"];document.querySelector("#palette").innerHTML=colors.map((c,i)=>`<button class="color ${i===0?"selected":""}" title="${c}" aria-label="Select color ${c}" style="background:${c}" data-color="${c}"></button>`).join("");document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll(".color").forEach(x=>x.classList.toggle("selected",x===b))});function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function down(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;start=pos(e);undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.beginPath();ctx.moveTo(start.x,start.y);let brush=document.querySelector("#brush").value;ctx.strokeStyle=brush==="Eraser"?"white":color;ctx.lineWidth=+document.querySelector("#size").value*(brush==="Marker"?2:1);ctx.lineCap="round";ctx.lineJoin="round";ctx.globalAlpha=brush==="Pencil"?.48:brush==="Soft brush"?.25:brush==="Marker"?.55:1;if(document.querySelector("#shape").value==="free")ctx.lineTo(start.x+.1,start.y+.1);ctx.stroke()}function move(e){if(!drawing)return;e.preventDefault();let p=pos(e),shape=document.querySelector("#shape").value;ctx.beginPath();ctx.strokeStyle=document.querySelector("#brush").value==="Eraser"?"white":color;ctx.lineWidth=+document.querySelector("#size").value*(document.querySelector("#brush").value==="Marker"?2:1);ctx.lineCap="round";ctx.globalAlpha=document.querySelector("#brush").value==="Pencil"?.48:document.querySelector("#brush").value==="Soft brush"?.25:document.querySelector("#brush").value==="Marker"?.55:1;if(shape==="free"){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke();start=p}else{ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.moveTo(start.x,start.y);if(shape==="line"){ctx.lineTo(p.x,p.y)}else if(shape==="circle"){let radius=Math.hypot(p.x-start.x,p.y-start.y);ctx.arc(start.x,start.y,radius,0,Math.PI*2)}else if(shape==="square"){ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y)}else if(shape==="triangle"){ctx.lineTo(p.x,p.y);ctx.lineTo(start.x*2-p.x,p.y);ctx.closePath()}ctx.stroke()}}function up(){drawing=false;ctx.globalAlpha=1}canvas.addEventListener("pointerdown",down);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);document.querySelector("#undo").onclick=()=>{let img=undo.pop();if(img)ctx.putImageData(img,0,0)};document.querySelector("#clearCanvas").onclick=()=>{if(confirm("Clear this drawing?")){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);undo=[]}};document.querySelector("#saveDrawing").onclick=()=>{if(drawings.length>=12)return alert("To keep local storage manageable, remove a saved drawing before saving another.");drawings.unshift(canvas.toDataURL("image/png"));persist();render()};document.querySelectorAll("[data-delete-drawing]").forEach(b=>b.onclick=()=>{drawings.splice(+b.dataset.deleteDrawing,1);persist();render()})}
render();
</script>
</body>
</html>
